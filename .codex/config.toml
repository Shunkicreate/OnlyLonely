[mcp_servers.serena]
command = "uvx"
args = ["--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server", "--context", "codex"]

[hooks.Stop]
commands = [
  { cmd = "uvx", args = ["--from", "git+https://github.com/oraios/serena", "serena", "project", "activate", "--path", "." ] }
]
